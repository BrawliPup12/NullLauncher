name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build NullLauncher.exe
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm NullLauncher.spec

      - name: Smoke test
        shell: pwsh
        run: .\dist\NullLauncher.exe --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullLauncher-windows
          path: dist/NullLauncher.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NullLauncher.exe
          generate_release_notes: true
