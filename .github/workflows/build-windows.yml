name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.lock

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Reinstall the two release-critical wheels from exact PyPI hashes.
          python -m pip install --force-reinstall --no-deps --only-binary=:all: --require-hashes -r requirements-build.lock

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Verify release tag matches launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "from null_launcher.config import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match APP_VERSION $version" }

      - name: Sync Windows metadata
        shell: pwsh
        run: python scripts/sync_version_info.py

      - name: Build NullLauncher.exe
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm NullLauncher.spec

      - name: Verify Windows resources
        shell: pwsh
        run: python scripts/verify_windows_build.py dist\NullLauncher.exe

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\NullLauncher.exe -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NullLauncher.exe --version exited with code $($process.ExitCode)" }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NullLauncher-windows
          path: dist/NullLauncher.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NullLauncher-windows
          path: dist

      - name: Authenticode sign (optional)
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "NullLauncher-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert) { throw "Signing certificate could not be imported" }
          $signature = Set-AuthenticodeSignature -FilePath .\dist\NullLauncher.exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          if ($signature.Status -ne "Valid") { throw "Authenticode signing failed: $($signature.Status) $($signature.StatusMessage)" }
          Remove-Item -Force $pfx

      - name: Smoke test signed artifact
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\NullLauncher.exe -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Signed NullLauncher.exe --version exited with code $($process.ExitCode)" }

      - name: Create SHA-256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\NullLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\NullLauncher.exe.sha256 -Value "$hash  NullLauncher.exe" -Encoding ascii -NoNewline

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" .\dist\NullLauncher.exe .\dist\NullLauncher.exe.sha256 --clobber
          } else {
            gh release create "${{ github.ref_name }}" .\dist\NullLauncher.exe .\dist\NullLauncher.exe.sha256 --generate-notes --title "${{ github.ref_name }}"
          }
